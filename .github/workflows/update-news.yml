name: Update news

on:
  schedule:
    - cron: "0 5 * * *"   # يوميًا 05:00 UTC (7:00 صباحًا بتوقيت بيروت شتاءً)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/fetch_news.py"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch news
        run: python scripts/fetch_news.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/news.json
          git diff --staged --quiet || git commit -m "Update news"
          git push
